# HVS-80 gameplay capture — RetroArch ffmpeg record-driver preset.
#
# Referenced from /opt/retropie/configs/all/retroarch.cfg as
#     video_record_config = "/home/pi/handheld-video-synth/pi/hvs_record.cfg"
# by pi/emurec_setup.sh. RetroArch ONLY reads this file when
#     video_record_quality = "0"        (RECORD_CONFIG_TYPE_RECORDING_CUSTOM)
# — every other quality preset is hardcoded C and ignores the path without
# saying so (libretro/RetroArch#17559). If recordings come out looking like
# nothing here applied, that setting is why.
#
# What this is tuned for: a Pi Zero 2 W (four A53s at ~1GHz, 237MB of RAM)
# running an 8/16-bit core AND a software H.264 encoder at the same time.
# RetroArch's record driver has no hardware-encoder path at all — every one
# of its built-in presets is libx264/libx264rgb/libvpx — so the only lever
# that matters is how little work x264 is asked to do.
#
# Every key beginning `video_` that is not in the driver's own list is passed
# straight through to the encoder as an AVOption with the prefix stripped:
# video_preset -> preset, video_tune -> tune, video_crf -> crf. That is how
# x264 gets configured here; there is no other syntax for it.

vcodec = "libx264"
video_preset = "ultrafast"
video_tune = "animation"
video_crf = "23"
pix_fmt = "yuv420p"

# The core hands the recorder RGB565 or XRGB8888 frames; naming yuv420p here
# is what keeps x264 off its RGB path (libx264rgb, the driver's no-config
# default, at qp 0 — lossless RGB, which this machine cannot afford).

# Halve the encoded framerate at the source. A 60Hz core records at 30fps,
# which is half the encoder's work for free AND already the framerate every
# clip on this card is normalised to — so nothing is lost twice. The video
# time base is scaled with it, so the recording plays at the right speed.
frame_drop_ratio = "2"

# Two encoder threads, not four: the other two are running the game.
threads = "2"

# 1 = the core's own framebuffer, unscaled (256x240, 240x160...). Scaling up
# here would cost CPU to make a bigger frame that tools/emurec.py then has to
# scale back down. Resizing happens once, later, off the critical path.
scale_factor = "1"

# FLAC, not AAC. It is the record driver's own default, it is cheap to
# encode, and it steps around the standing bug where AAC recordings come out
# with an audio stream present and no audio in it (libretro/RetroArch#13021).
# Size does not matter for a staging file that lives for one transcode, and
# tools/emurec.py re-encodes to the 44.1kHz AAC the clips use anyway — with
# ffmpeg's real resampler rather than RetroArch's fixed-ratio one.
acodec = "flac"
audio_enable = "true"

# Matroska: a session that ends with a flat battery or a yanked cartridge
# leaves a file that still plays up to the last written cluster. The same
# accident to an .mp4 leaves a file with no moov atom and nothing recoverable
# — which is exactly the failure this project has already had once with its
# own recorder. The .mp4 the synth plays is made later, on purpose, from a
# file that is complete.
format = "matroska"

# Deliberately NOT set: sample_rate. Left alone, RetroArch stamps audio from
# the core's own sample count (NES 32040Hz, SNES 32000Hz, GBA 32768Hz...) and
# video from its frame count, so the two cannot drift from each other. Naming
# a rate here makes it resample at a fixed ratio instead, and a fixed ratio
# applied to a core whose clock is not exactly what it claims is how a
# recording ends up slowly going out of tune.
